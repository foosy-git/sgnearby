name: Deploy Next.js to GCP VM

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci

      - name: Build Next.js App
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
        
      - name: Tar build output
        run: tar -czf next-build.tar.gz .next

      - name: Validate Deployment Secrets
        run: |
          MISSING=""
          if [ -z "${{ secrets.SERVER_HOST }}" ]; then MISSING="$MISSING SERVER_HOST"; fi
          if [ -z "${{ secrets.SERVER_USER }}" ]; then MISSING="$MISSING SERVER_USER"; fi
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then MISSING="$MISSING SSH_PRIVATE_KEY"; fi
          if [ -n "$MISSING" ]; then
            echo "::error::Missing required GitHub Secrets:$MISSING. Please add them in GitHub repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "All required deployment secrets are present."

      - name: Ensure target directory exists on VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ~/apps/sgnearby
            if [ ! -d "~/apps/sgnearby/.git" ]; then
              git clone https://github.com/foosy-git/sgnearby.git ~/apps/sgnearby
            fi

      - name: Copy build to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "next-build.tar.gz"
          target: "~/apps/sgnearby"

      - name: Restart Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/apps/sgnearby
            
            # Pull the latest source files (package.json, public/, etc)
            git reset --hard
            git pull origin main
            
            # Install production dependencies only
            npm install --omit=dev
            
            # Extract the pre-built .next folder from GitHub Actions
            tar -xzf next-build.tar.gz
            rm next-build.tar.gz
            
            # Restart or start the app in PM2 on port 3001
            pm2 restart "sgnearby" || pm2 start "npm run start" --name "sgnearby"
            pm2 save
